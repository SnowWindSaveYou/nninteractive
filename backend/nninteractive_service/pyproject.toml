[project]
name = "nninteractive-unity-backend"
version = "0.1.0"
description = "Unity-facing nnInteractive segmentation backend MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# local 模式:本机 GPU 真实推理。torch 必须用 cu124 版,见 requirements-local.txt
# 和 DEPLOY.md「坑 1」。直接 `pip install -e .[real]` 会从 PyPI 装 CPU 版 torch,
# 生产部署请改用 `pip install -r requirements-local.txt`。
real = [
  "nnInteractive==2.5.1",
  "torch>=2.1.2,!=2.9.*",  # 必须装 cu124 build,不是 PyPI 默认 CPU 版
  "nibabel>=5.0",
]
remote = [
  "nninteractive-client==2.5.1",  # 与 nnInteractive 同版本,pinned in lockstep
  "httpx>=0.27",
  "blosc2>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
